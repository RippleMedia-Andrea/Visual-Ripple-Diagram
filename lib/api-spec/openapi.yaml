openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: journeys
    description: Signed-in Purpose Lab journey progress
  - name: account
    description: Signed-in account state
paths:
  /password-reset-availability:
    get:
      operationId: getPasswordResetAvailability
      tags: [account]
      summary: Check whether password reset email delivery is configured
      responses:
        "200":
          description: Password reset capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetAvailability"
  /account:
    get:
      operationId: getAccount
      tags: [account]
      security: [{ cookieAuth: [] }]
      summary: Get the signed-in user's account state
      responses:
        "200":
          description: Account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401": { description: Sign in required }
  /account/consent:
    patch:
      operationId: recordAiConsent
      tags: [account]
      security: [{ cookieAuth: [] }]
      summary: Record AI processing consent for the signed-in user
      responses:
        "200":
          description: Consent timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiConsentAt: { type: string, format: date-time }
                required: [aiConsentAt]
        "401": { description: Sign in required }
  /account/welcome:
    patch:
      operationId: recordWelcomeSeen
      tags: [account]
      security: [{ cookieAuth: [] }]
      summary: Record that the signed-in user saw the welcome screen
      responses:
        "200":
          description: Welcome timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  welcomeSeenAt: { type: string, format: date-time }
                required: [welcomeSeenAt]
        "401": { description: Sign in required }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /journeys/current:
    get:
      operationId: getCurrentJourney
      tags: [journeys]
      summary: Load or create the signed-in user's current journey
      responses:
        "200":
          description: Current journey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        "401":
          description: Sign in required
  /journeys/{id}:
    patch:
      operationId: updateJourney
      tags: [journeys]
      summary: Save journey progress
      parameters:
        - $ref: "#/components/parameters/JourneyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JourneyUpdate"
      responses:
        "200":
          description: Updated journey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyRecord"
        "401":
          description: Sign in required
        "404":
          description: Journey not found
  /journeys/{id}/discoveries/{stage}:
    post:
      operationId: extractJourneyDiscoveries
      tags: [journeys]
      summary: Extract and save discoveries from a journey stage
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/JourneyId"
        - $ref: "#/components/parameters/DiscoveryStage"
      responses:
        "200":
          description: Structured discoveries for the requested stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResponse"
        "400": { description: Invalid discovery stage }
        "401": { description: Sign in required }
        "403": { description: AI processing consent required }
        "404": { description: Journey not found }
        "429": { description: Extraction limit reached }
  /story-cards/{id}:
    patch:
      operationId: updateStoryCard
      tags: [journeys]
      summary: Update an owned story card
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/StoryCardId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoryCardUpdate" }
      responses:
        "200": { description: Updated story card, content: { application/json: { schema: { $ref: "#/components/schemas/StoryCard" } } } }
        "401": { description: Sign in required }
        "404": { description: Story card not found }
    delete:
      operationId: deleteStoryCard
      tags: [journeys]
      summary: Delete an owned story card
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/StoryCardId" }]
      responses:
        "204": { description: Story card deleted }
        "401": { description: Sign in required }
        "404": { description: Story card not found }
  /journeys/{id}/themes:
    post:
      operationId: createPurposeTheme
      tags: [journeys]
      summary: Add a purpose theme to an owned journey
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/JourneyId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurposeThemeCreate" }
      responses:
        "201": { description: Created theme, content: { application/json: { schema: { $ref: "#/components/schemas/PurposeTheme" } } } }
        "401": { description: Sign in required }
        "404": { description: Journey not found }
  /themes/{id}:
    patch:
      operationId: updatePurposeTheme
      tags: [journeys]
      summary: Update an owned purpose theme
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ThemeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurposeThemeUpdate" }
      responses:
        "200": { description: Updated theme, content: { application/json: { schema: { $ref: "#/components/schemas/PurposeTheme" } } } }
        "401": { description: Sign in required }
        "404": { description: Theme not found }
    delete:
      operationId: deletePurposeTheme
      tags: [journeys]
      summary: Delete an owned purpose theme
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ThemeId" }]
      responses:
        "204": { description: Theme deleted }
        "401": { description: Sign in required }
        "404": { description: Theme not found }
  /journeys/{id}/restart:
    post:
      operationId: restartJourney
      tags: [journeys]
      summary: Archive the current journey and begin a new one
      parameters:
        - $ref: "#/components/parameters/JourneyId"
      responses:
        "201":
          description: New current journey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        "401":
          description: Sign in required
        "404":
          description: Journey not found
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  parameters:
    JourneyId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    StoryCardId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    ThemeId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    DiscoveryStage:
      name: stage
      in: path
      required: true
      schema:
        type: string
        enum: [reveal, identify, personalize, live]
  schemas:
    PasswordResetAvailability:
      type: object
      properties:
        available: { type: boolean }
        supportEmail: { type: string }
      required: [available, supportEmail]
    Account:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        aiConsentAt: { type: [string, "null"], format: date-time }
        welcomeSeenAt: { type: [string, "null"], format: date-time }
      required: [id, email, name, aiConsentAt, welcomeSeenAt]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required: [role, content]
    StageMessages:
      type: object
      properties:
        reveal:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        identify:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        pinpoint:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        personalize:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        live:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        expand:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required: [reveal, identify, pinpoint, personalize, live, expand]
    JourneyRecord:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        status:
          type: string
          enum: [in_progress, complete]
        currentStageIdx:
          type: integer
          minimum: 0
          maximum: 5
        selectedPrompts:
          type: array
          items:
            type: string
        purposeOptions:
          type: array
          items:
            type: string
        purposeStatement:
          type: [string, "null"]
        season:
          $ref: "#/components/schemas/Season"
        actionPlan:
          $ref: "#/components/schemas/ActionPlan"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
      required:
        - id
        - userId
        - status
        - currentStageIdx
        - selectedPrompts
        - purposeOptions
        - createdAt
        - updatedAt
    Journey:
      allOf:
        - $ref: "#/components/schemas/JourneyRecord"
        - type: object
          properties:
            messages:
              $ref: "#/components/schemas/StageMessages"
            storyCards:
              type: array
              items: { $ref: "#/components/schemas/StoryCard" }
            themes:
              type: array
              items: { $ref: "#/components/schemas/PurposeTheme" }
          required: [messages, storyCards, themes]
    JourneyUpdate:
      type: object
      properties:
        currentStageIdx:
          type: integer
          minimum: 0
          maximum: 5
        selectedPrompts:
          type: array
          items:
            type: string
        purposeOptions:
          type: array
          items:
            type: string
        purposeStatement:
          type: [string, "null"]
        status:
          type: string
          enum: [in_progress, complete]
        season: { $ref: "#/components/schemas/Season" }
        actionPlan: { $ref: "#/components/schemas/ActionPlan" }
    Evidence:
      type: object
      required: [storyTitle, detail]
      properties:
        storyTitle: { type: string }
        detail: { type: string }
    StoryCard:
      type: object
      properties:
        id: { type: integer }
        journeyId: { type: integer }
        position: { type: integer }
        title: { type: string }
        summary: { type: string }
        promptId: { type: [string, "null"] }
        isDifficultExperience: { type: boolean }
        actions: { type: array, items: { type: string } }
        feelings: { type: array, items: { type: string } }
        people: { type: array, items: { type: string } }
        impact: { type: array, items: { type: string } }
        userEdited: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PurposeTheme:
      type: object
      properties:
        id: { type: integer }
        journeyId: { type: integer }
        position: { type: integer }
        name: { type: string }
        description: { type: string }
        evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
        userEdited: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Season:
      type: object
      properties:
        summary: { type: string }
        roles: { type: array, items: { type: string } }
        capacity: { type: string }
        constraints: { type: array, items: { type: string } }
        opportunities: { type: array, items: { type: string } }
        expressions: { type: array, items: { type: string } }
    ActionPlan:
      type: object
      properties:
        start: { type: array, items: { type: string } }
        stop: { type: array, items: { type: string } }
        continue: { type: array, items: { type: string } }
        oneStepThisWeek: { type: string }
    StoryCardUpdate:
      type: object
      properties:
        title: { type: string }
        summary: { type: string }
        promptId: { type: [string, "null"] }
        isDifficultExperience: { type: boolean }
        actions: { type: array, items: { type: string } }
        feelings: { type: array, items: { type: string } }
        people: { type: array, items: { type: string } }
        impact: { type: array, items: { type: string } }
    PurposeThemeCreate:
      type: object
      required: [name, description]
      properties:
        position: { type: integer }
        name: { type: string }
        description: { type: string }
        evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
    PurposeThemeUpdate:
      $ref: "#/components/schemas/PurposeThemeCreate"
    ExtractionResponse:
      oneOf:
        - type: object
          properties:
            stories: { type: array, items: { $ref: "#/components/schemas/StoryCard" } }
        - type: object
          properties:
            themes: { type: array, items: { $ref: "#/components/schemas/PurposeTheme" } }
        - type: object
          properties:
            season: { $ref: "#/components/schemas/Season" }
        - type: object
          properties:
            actionPlan: { $ref: "#/components/schemas/ActionPlan" }

